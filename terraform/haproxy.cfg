global
  daemon

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend http_in
  bind *:80
  default_backend web_servers

backend web_servers
  balance roundrobin
  option httpchk GET /
  default-server inter 2s fall 2 rise 2 init-addr last,libc,none resolvers docker
  server web1 web1:80 check
  server web2 web2:80 check
  server web3 web3:80 check

frontend stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
